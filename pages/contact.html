    <!-- Custom CSS -->
    <link rel="stylesheet" type="text/css" href="../assets/css/style.css" />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Lora"
      rel="stylesheet"
    />

    <!-- Correct Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Navbar, Start -->
    <nav class="navbar navbar-expand-lg" style="background-color: #b8c9e0">
      <div class="container-fluid">
        <a
          class="navbar-brand d-flex align-items-center gap-4"
          href="../index.html"
        >
          <img
            src="../assets/images/Logo Icon Favicon 500x443.png"
            alt="Logo"
            width="30"
            height="30"
          />
        </a>
        <button
          class="navbar-toggler p-2 border-0 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fa-solid fa-bars fa-sm" style="color: #f84d98"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" href="landing.html">GIF Hub</a>
            <a class="nav-link" href="about.html">About</a>
            <a class="nav-link" href="contact.html">Contact</a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Navbar, End -->

    <div class="container mt-5 mb-5" style="max-width: 700px">
      <h2 class="text-center mb-4">Contact Me</h2>

      <!-- Message alert box -->
      <div id="form-alert" class="mb-3"></div>

      <form id="contact-form" method="POST">
        <!-- Email -->
        <div class="mb-3 row align-items-center">
          <label for="email" class="col-sm-3 col-form-label text-end"
            >Email</label
          >
          <div class="col-sm-9">
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            />
          </div>
        </div>

        <!-- Subject -->
        <div class="mb-3 row align-items-center">
          <label for="subject" class="col-sm-3 col-form-label text-end"
            >Subject</label
          >
          <div class="col-sm-9">
            <input
              type="text"
              class="form-control"
              id="subject"
              name="subject"
              required
            />
          </div>
        </div>

        <!-- Message -->
        <div class="mb-3 row align-items-start">
          <label for="message" class="col-sm-3 col-form-label text-end"
            >Message</label
          >
          <div class="col-sm-9">
            <textarea
              class="form-control"
              id="message"
              name="message"
              rows="5"
              required
              oninput="this.style.height='auto'; this.style.height=this.scrollHeight + 'px';"
            ></textarea>
          </div>
        </div>

        <!-- Submit button -->
        <div class="text-center">
          <button type="submit" class="btn btn-primary px-4">Send</button>
        </div>
      </form>
    </div>

    <!-- Footer, Start -->
    <footer
      style="background-color: #dce4ef"
      class="text-center text-lg-start mt-5 border-top"
    >
      <div class="container p-4">
        <div class="row">
          <!-- Navigation Links -->
          <div class="col-lg-6 col-md-12 mb-4 mb-md-0">
            <h5 class="text-uppercase">Navigation</h5>
            <ul class="list-unstyled mb-0">
              <li>
                <a href="/index.html" class="text-dark text-decoration-none"
                  >Home</a
                >
              </li>
              <li>
                <a href="./about.html" class="text-dark text-decoration-none"
                  >About</a
                >
              </li>
              <li>
                <a href="./contact.html" class="text-dark text-decoration-none"
                  >Contact</a
                >
              </li>
              <li>
                <a href="./landing.html" class="text-dark text-decoration-none"
                  >GIF Hub</a
                >
              </li>
            </ul>
          </div>

          <!-- Social Media Links -->
          <div class="col-lg-6 col-md-12 mb-4 mb-md-0">
            <h5 class="text-uppercase">Follow</h5>
            <a
              href="https://github.com/FizzyMo"
              class="text-dark me-4"
              target="_blank"
              ><i class="fab fa-github fa-lg"></i
            ></a>

            <a
              href="https://www.linkedin.com/in/carisa-saenz-videtto-669929173/"
              class="text-dark me-4"
              target="_blank"
              ><i class="fab fa-linkedin fa-lg"></i
            ></a>
            <a
              href="https://www.tumblr.com/silencewritten"
              class="text-dark me-4"
              target="_blank"
              ><i class="fa-brands fa-tumblr"></i
            ></a>
          </div>
        </div>
      </div>

      <div
        class="text-center p-3"
        style="background-color: #c3cfdf; color: #333"
      >
        © 2025 Inloop | Built with ❤️ by Carisa
      </div>
    </footer>
    <!-- Footer, End -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"

    <!-- Contact Form JavaScript -->
    <script src="../api/contact-submit.js"></script>
    <script src="../assets/javascript/contact.js"></script>
    <!-- Custom JavaScript -->
    <script src="../assets/javascript/main.js"></script>
  </body>
</html>
